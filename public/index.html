<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Automator Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>Automator<span class="highlight">Pro By Mr Aryan</span></h1>
            </div>
            <div class="status-indicator">
                <span class="pulse"></span> System Active
            </div>
        </header>

        <main class="dashboard">
            <section class="add-job-section glass-panel">
                <div class="tabs">
                    <button class="tab-btn active" id="tab-btn-single">Single Video</button>
                    <button class="tab-btn" id="tab-btn-bulk">CSV Bulk Upload</button>
                </div>
                
                <div id="tab-single" class="tab-content active">
                    <h2>Add New Video</h2>
                    <form id="job-form">
                        <div class="input-group">
                            <label for="url">Video URL</label>
                            <input type="url" id="url" placeholder="https://lms.aimdip.org/dashboard/course?module=..." required>
                        </div>
                        <div class="input-group">
                            <label for="duration">Duration (Minutes)</label>
                            <input type="number" id="duration" placeholder="62" min="1" required>
                        </div>
                        <button type="submit" class="btn-primary">Add to Queue</button>
                    </form>
                </div>

                <div id="tab-bulk" class="tab-content">
                    <h2>Bulk Upload via CSV</h2>
                    <p class="help-text" style="color: #cbd5e1; margin-bottom: 1rem; font-size: 0.9rem;">CSV format: url,duration</p>
                    <input type="file" id="csv-file" accept=".csv" class="file-input" />
                    
                    <div id="csv-preview" class="csv-preview hidden" style="margin-top: 1.5rem;">
                        <h4 style="margin-bottom: 0.5rem;">Preview (<span id="csv-count">0</span> videos):</h4>
                        <div class="preview-list" id="csv-list" style="max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;"></div>
                        <button id="btn-upload-csv" class="btn-primary">Add All to Queue</button>
                    </div>
                </div>
            </section>

            <section class="queue-section glass-panel" style="margin-bottom: 3rem;">
                <h2>Up Next in Queue (<span id="queue-count">0</span> pending)</h2>
                <div id="queue-list" class="queue-list">
                    <p style="color: #94a3b8;">Queue is empty.</p>
                </div>
            </section>

            <section class="jobs-section">
                <h2>Active Sessions</h2>
                <div id="jobs-grid" class="jobs-grid">
                    <!-- Jobs will be injected here dynamically -->
                </div>
            </section>
        </main>
    </div>

    <!-- Live View Modal -->
    <div id="live-view-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3>Live Browser View</h3>
                <button id="close-modal" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="stream-container">
                    <img id="live-stream" src="" alt="Live feed loading...">
                    <div class="loader-overlay" id="stream-loader">
                        <div class="spinner"></div>
                        <p>Connecting to headless browser...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>

</html>
